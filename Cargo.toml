[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async Runtime & Networking
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# Storage
object_store = { version = "0.12", features = ["aws", "gcp", "azure"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Compression
zstd = "0.13"
lz4_flex = "0.11"

# Concurrency
dashmap = "6"
crossbeam-skiplist = "0.1"
moka = { version = "0.12", features = ["future"] }
parking_lot = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Configuration & CLI
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
globset = "0.4"
regex = "1"
bytes = "1"
thiserror = "2"
anyhow = "1"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
crc32fast = "1"
jsonwebtoken = "9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
argon2 = "0.5"

# Allocator
mimalloc = { version = "0.1", default-features = false }

# Internal crates
bigrag-storage = { path = "crates/bigrag-storage" }
bigrag-index = { path = "crates/bigrag-index" }
bigrag-query = { path = "crates/bigrag-query" }
bigrag-api = { path = "crates/bigrag-api" }
bigrag-common = { path = "crates/bigrag-common" }
