services:
  rag-computer:
    build: ./api
    container_name: rag-computer
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - rag_computer_data:/data
    environment:
      # Default is 'dev'. Set RAG_COMPUTER_ENV=prod in production — this
      # enables startup checks that refuse insecure defaults (wildcard
      # CORS, non-secure cookies, default Postgres password).
      RAG_COMPUTER_ENV: "${RAG_COMPUTER_ENV:-dev}"
      RAG_COMPUTER_DATABASE_URL: postgres://rag_computer:rag_computer@postgres:5432/rag_computer?sslmode=disable
      RAG_COMPUTER_QDRANT_URL: http://qdrant:6333
      RAG_COMPUTER_REDIS_URL: redis://redis:6379/0
      RAG_COMPUTER_HOST: 0.0.0.0
      RAG_COMPUTER_SESSION_COOKIE_SECURE: "${RAG_COMPUTER_SESSION_COOKIE_SECURE:-false}"
      RAG_COMPUTER_CORS_ORIGINS: '${RAG_COMPUTER_CORS_ORIGINS:-["http://localhost:3000"]}'
      RAG_COMPUTER_UPLOAD_DIR: /data/uploads
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17
    container_name: rag-computer-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Change these credentials for production deployments
      POSTGRES_USER: rag_computer
      POSTGRES_PASSWORD: rag_computer
      POSTGRES_DB: rag_computer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c work_mem=8MB -c effective_cache_size=768MB
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_computer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-computer-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: rag-computer-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2g
volumes:
  rag_computer_data:
  postgres_data:
  redis_data:
  qdrant_data:
