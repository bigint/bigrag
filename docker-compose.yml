services:
  bigrag:
    build: ./api
    container_name: bigrag
    restart: unless-stopped
    ports:
      - "6000:6000"
    volumes:
      - bigrag_data:/data
    environment:
      BIGRAG_DATABASE_URL: postgres://bigrag:bigrag@postgres:5432/bigrag?sslmode=disable
      BIGRAG_MILVUS_URI: http://milvus:19530
      BIGRAG_REDIS_URL: redis://redis:6379/0
      BIGRAG_AUTH_REQUIRED: "false"
      BIGRAG_LOG_LEVEL: info
      BIGRAG_UPLOAD_DIR: /data/uploads
      BIGRAG_INGESTION_WORKERS: "4"
      BIGRAG_DB_POOL_MIN: "5"
      BIGRAG_DB_POOL_MAX: "50"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bigrag-ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: bigrag-ui
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      bigrag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17
    container_name: bigrag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Change these credentials for production deployments
      POSTGRES_USER: bigrag
      POSTGRES_PASSWORD: bigrag
      POSTGRES_DB: bigrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c work_mem=8MB -c effective_cache_size=768MB
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bigrag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus internal dependencies (not exposed to host)
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: bigrag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: bigrag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus.yaml:/milvus/configs/user.yaml:ro
    deploy:
      resources:
        limits:
          memory: 4g
    depends_on:
      milvus-etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  bigrag_data:
  postgres_data:
  redis_data:
  etcd_data:
  milvus_data:
