[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigrag"
version = "2026.5.7"
description = "Python SDK for the bigRAG platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "bigRAG", email = "dev@bigrag.dev" }]
keywords = ["bigrag", "rag", "vector", "search", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/yoginth/bigrag"
Documentation = "https://bigrag.dev/docs/sdks/python"
Repository = "https://github.com/yoginth/bigrag"
Issues = "https://github.com/yoginth/bigrag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bigrag"]

[tool.deptry]
known_first_party = ["bigrag"]
