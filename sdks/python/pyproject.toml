[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-computer"
version = "2026.5.7"
description = "Python SDK for the rag.computer platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "rag.computer", email = "dev@rag.computer" }]
keywords = ["rag-computer", "rag", "vector", "search", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/yoginth/rag-computer"
Documentation = "https://rag.computer/docs/sdks/python"
Repository = "https://github.com/yoginth/rag-computer"
Issues = "https://github.com/yoginth/rag-computer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_computer"]

[tool.deptry]
known_first_party = ["rag_computer"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["rag_computer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
