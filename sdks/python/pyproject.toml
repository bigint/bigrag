[project]
name = "bigrag"
version = "0.1.0"
description = "Python client for bigRAG vector database"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
async = ["aiohttp>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
