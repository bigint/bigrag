[package]
name = "bigrag"
version = "2026.4.30"
edition = "2021"
rust-version = "1.75"
description = "Rust client for bigRAG — a self-hostable RAG platform"
license = "MIT"
repository = "https://github.com/bigint/bigrag"
documentation = "https://docs.rs/bigrag"
keywords = ["rag", "vector-search", "embeddings", "ai", "document-ingestion"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "query", "stream"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
bytes = "1"
