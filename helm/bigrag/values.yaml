image:
  repository: bigrag/bigrag
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

env:
  BIGRAG_HOST: "0.0.0.0"
  BIGRAG_PORT: "8080"
  BIGRAG_LOG_LEVEL: "info"
  BIGRAG_DATABASE_URL: ""       # Set via secret or configmap
  BIGRAG_MILVUS_URI: ""         # Set via secret or configmap
  BIGRAG_UPLOAD_DIR: "/data/uploads"
  BIGRAG_EMBEDDING_PROVIDER: "sentence-transformers"
  BIGRAG_EMBEDDING_MODEL: "all-MiniLM-L6-v2"

auth:
  masterKey: ""
  existingSecret: ""
  secretKey: "master-key"

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: "2"

nodeSelector: {}
tolerations: []
affinity: {}
