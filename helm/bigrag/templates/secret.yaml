{{- if and .Values.auth.masterKey (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bigrag.fullname" . }}-auth
  labels:
    {{- include "bigrag.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.masterKey | b64enc | quote }}
{{- end }}
