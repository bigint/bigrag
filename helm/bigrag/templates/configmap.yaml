apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bigrag.fullname" . }}
  labels:
    {{- include "bigrag.labels" . | nindent 4 }}
data:
  bigrag.toml: |
    [server]
    host = "0.0.0.0"
    port = {{ .Values.service.port }}
    metrics_port = {{ .Values.service.metricsPort }}

    [storage]
    backend = {{ .Values.storage.backend | quote }}
    path = {{ .Values.storage.path | quote }}
    {{- if .Values.storage.bucket }}
    bucket = {{ .Values.storage.bucket | quote }}
    {{- end }}
    {{- if .Values.storage.region }}
    region = {{ .Values.storage.region | quote }}
    {{- end }}
    {{- if .Values.storage.prefix }}
    prefix = {{ .Values.storage.prefix | quote }}
    {{- end }}
    {{- if .Values.storage.endpoint }}
    endpoint = {{ .Values.storage.endpoint | quote }}
    {{- end }}

    [cache]
    [cache.dram]
    size_percent = {{ .Values.cache.dram.sizePercent }}

    {{- if .Values.cache.nvme.enabled }}
    [cache.nvme]
    enabled = true
    path = "/cache"
    {{- end }}
