# bigRAG configuration file (TOML)
#
# Loaded by `bigrag` at startup via `--config bigrag.toml`. Most runtime keys can
# also be set as environment variables with the BIGRAG_ prefix (env vars override
# TOML). Keys must match Settings field names — see api/bigrag/config.py.
#
# Most values shown below are defaults; optional unset values show common examples.

# env = "dev"                   # dev | prod (prod enables startup safety checks)

# host = "127.0.0.1"
# port = 4000
# workers = 1
# log_level = "debug"             # debug | info | warning | error
# log_format = "text"             # text | json
# cors_origins = []
# trusted_proxies = []              # CIDRs allowed to supply X-Forwarded-For

# database_url = "postgres://bigrag:bigrag@localhost:5432/bigrag?sslmode=disable"
# db_pool_min = 5
# db_pool_max = 50
# migration_timeout_seconds = 60

# qdrant_url = "http://localhost:6333"
# qdrant_connect_timeout_seconds = 10
# qdrant_required = false

# turbopuffer_api_key = ""         # required only for collections using turbopuffer
# turbopuffer_region = "aws-us-east-1"
# turbopuffer_namespace_prefix = "bigrag_"

# redis_url = "redis://localhost:6379/0"

# Encryption key for provider secrets at rest. Required in env=prod.
# Generate with:
#   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
# master_key = ""
# master_key_previous = []          # old Fernet keys for staged rotation

# session_expiry_hours = 168
# session_cookie_name = "bigrag_session"
# session_cookie_secure = false   # set true behind HTTPS
# session_cookie_samesite = "lax"
# session_cookie_domain = ""
# auth_principal_cache_ttl = 60
# allow_public_bind_in_prod = false  # required to bind 0.0.0.0 when env=prod

# embedding_provider = "openai"   # openai | openai_compatible | cohere | voyage
# embedding_model = "text-embedding-3-small"
# embedding_dimension = 1536
# embedding_base_url = ""          # required for openai_compatible endpoints
# embedding_api_key = ""           # use BIGRAG_EMBEDDING_API_KEY in production
# allowed_embedding_base_urls = []
# allow_private_embedding_base_urls = false

# chat_provider = "openai"         # openai | openai_compatible
# chat_model = "gpt-4o-mini"
# chat_base_url = ""               # required for openai_compatible endpoints
# chat_temperature = 0.2
# chat_max_context_chars = 120000
# allowed_chat_base_urls = []
# allow_private_chat_base_urls = false

# upload_dir = "./data/uploads"

# Optional S3-compatible backup destination (also configurable via settings UI).
# backup_s3_bucket = ""
# backup_s3_endpoint_url = ""
# backup_s3_region = "us-east-1"
# backup_s3_prefix = ""
# backup_s3_access_key_id = ""
# backup_s3_secret_access_key = ""
# backup_s3_force_path_style = false

# max_upload_size_mb = 64
# max_batch_upload_size_mb = 128
# max_upload_session_files = 10000
# max_upload_session_size_mb = 102400
# upload_session_item_retention_hours = 168
# ingestion_workers = 4
# ingestion_batch_size = 128
# conversion_timeout = 300
# queue_max_depth = 10000
# collection_cache_ttl = 30
# query_embedding_cache_ttl = 3600
# query_result_cache_ttl = 30
# embedding_cache_mode = "encrypted"  # encrypted | disabled
# embedding_cache_retention_days = 30

# max_vector_upsert_count = 1000
# max_vector_delete_count = 10000
# max_vector_text_chars = 100000
# max_vector_metadata_bytes = 65536

# webhook_delivery_timeout = 10
# webhook_retry_delays = [10, 30, 90]
# webhook_max_count = 50
# allow_local_webhooks = false
