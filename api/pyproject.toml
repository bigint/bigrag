[project]
name = "bigrag"
version = "2026.4.30"
description = "Self-hostable RAG platform with Docling ingestion and Qdrant vector DB"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "starlette>=1.0.0,<2",
    "uvicorn[standard]>=0.34.0,<1",
    "asyncpg>=0.30.0,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14.0,<2",
    "qdrant-client>=1.17.0,<2",
    "docling>=2.25.0,<3",
    "pypdfium2>=5.7.0,<6",
    "huggingface-hub>=0.36.0,<2",
    "openai>=2.33.0,<3",
    "cohere>=6.1.0,<7",
    "pydantic[email]>=2.10.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "python-multipart>=0.0.18,<1",

    "httpx>=0.28.0,<1",
    "tomli>=2.2.0,<3",
    "redis[hiredis]>=5.2.0,<8",
    "orjson>=3.10.0,<4",
    "structlog>=24.4.0,<26",
    "argon2-cffi>=23.1.0,<26",
    "cryptography>=48.0.0,<49",
    "boto3>=1.42.0,<2",
    "mcp>=1.12.0,<2",
    "tiktoken>=0.8.0,<1",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
bigrag = "bigrag.main:cli"
bigrag-mcp = "bigrag.mcp_server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bigrag"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "bigrag/_alembic"
"alembic.ini" = "bigrag/_alembic/alembic.ini"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "T201", "FA102"]
ignore = ["B008"]  # Depends() and Query() in FastAPI defaults are intentional

[tool.deptry.package_module_name_map]
argon2-cffi = "argon2"
python-multipart = "python_multipart"

[tool.deptry.per_rule_ignores]
DEP002 = ["python-multipart"]
