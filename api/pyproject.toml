[project]
name = "bigrag"
version = "0.1.0"
description = "Self-hostable RAG platform with Docling ingestion and Milvus vector DB"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "pymilvus>=2.5.0",
    "docling>=2.25.0",
    "sentence-transformers>=3.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "tomli>=2.2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.60.0"]
cohere = ["cohere>=5.13.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[project.scripts]
bigrag = "bigrag.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
