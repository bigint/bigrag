[project]
name = "bigrag"
version = "2026.4.30"
description = "Self-hostable RAG platform with Docling ingestion and Turbopuffer vector storage"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<1",
    "starlette>=1.6.0,<2",
    "uvicorn[standard]>=0.52.4,<1",
    "asyncpg>=0.31.0,<1",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "alembic>=1.19.2,<2",
    "docling>=2.126.0,<3",
    "pypdfium2>=5.13.0,<6",
    "huggingface-hub>=1.30.0,<2",
    "openai>=3.8.0,<4",
    "cohere>=7.1.1,<8",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.32,<1",
    "httpx>=0.28.1,<1",
    "httpx2>=2.12.0,<3",
    "redis[hiredis]>=8.1.0,<9",
    "orjson>=3.12.0,<4",
    "structlog>=26.1.0,<27",
    "argon2-cffi>=25.1.0,<26",
    "cryptography>=50.0.1,<51",
    "boto3>=1.43.89,<2",
    "mcp>=2.1.1,<3",
    "tiktoken>=0.14.0,<1",
    "dramatiq[redis]>=2.2.1,<3",
    "turbopuffer>=2.9.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[project.scripts]
bigrag = "bigrag.main:cli"
bigrag-mcp = "bigrag.mcp:cli"
bigrag-reencrypt = "bigrag.services.reencrypt:cli"
bigrag-worker = "bigrag.worker:cli"

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bigrag"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "bigrag/_alembic"
"alembic.ini" = "bigrag/_alembic/alembic.ini"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "T201", "FA102"]
ignore = ["B008"]  # Depends() and Query() in FastAPI defaults are intentional
