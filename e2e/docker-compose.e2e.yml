services:
  bigrag-api:
    environment:
      BIGRAG_ENV: dev
      BIGRAG_MASTER_KEY: "Zm5VZ4vO8r0y3rVsT0xz7nxV_wP7u6-n5tB1GAlHZIw="
      BIGRAG_LOG_LEVEL: info
      BIGRAG_LOGIN_RATE_LIMIT: "10000"
      HF_HOME: /data/hf
      HF_HUB_CACHE: /data/hf/hub
      TRANSFORMERS_CACHE: /data/hf/transformers
      BIGRAG_CORS_ORIGINS: '["http://localhost:3000","http://localhost:4000","http://127.0.0.1:3000","http://127.0.0.1:4000"]'
      BIGRAG_EMBEDDING_PROVIDER: openai_compatible
      BIGRAG_EMBEDDING_MODEL: text-embedding-3-small
      BIGRAG_EMBEDDING_DIMENSION: "1536"
      BIGRAG_EMBEDDING_BASE_URL: http://fake-openai:9001/v1
      BIGRAG_EMBEDDING_API_KEY: e2e-fake-key
      BIGRAG_ALLOW_PRIVATE_EMBEDDING_BASE_URLS: "true"
      BIGRAG_CHAT_PROVIDER: openai_compatible
      BIGRAG_CHAT_MODEL: gpt-4o-mini
      BIGRAG_CHAT_BASE_URL: http://fake-openai:9001/v1
      BIGRAG_CHAT_API_KEY: e2e-fake-key
      BIGRAG_ALLOW_PRIVATE_CHAT_BASE_URLS: "true"
      BIGRAG_ALLOW_LOCAL_WEBHOOKS: "true"
      BIGRAG_BACKUP_S3_BUCKET: bigrag-backups
      BIGRAG_BACKUP_S3_ENDPOINT_URL: http://minio:9000
      BIGRAG_BACKUP_S3_REGION: us-east-1
      BIGRAG_BACKUP_S3_ACCESS_KEY_ID: e2e
      BIGRAG_BACKUP_S3_SECRET_ACCESS_KEY: e2e-secret-password
      BIGRAG_BACKUP_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      fake-openai:
        condition: service_healthy

  bigrag-worker:
    environment:
      BIGRAG_ENV: dev
      BIGRAG_MASTER_KEY: "Zm5VZ4vO8r0y3rVsT0xz7nxV_wP7u6-n5tB1GAlHZIw="
      BIGRAG_LOG_LEVEL: info
      HF_HOME: /data/hf
      HF_HUB_CACHE: /data/hf/hub
      TRANSFORMERS_CACHE: /data/hf/transformers
      BIGRAG_EMBEDDING_PROVIDER: openai_compatible
      BIGRAG_EMBEDDING_MODEL: text-embedding-3-small
      BIGRAG_EMBEDDING_DIMENSION: "1536"
      BIGRAG_EMBEDDING_BASE_URL: http://fake-openai:9001/v1
      BIGRAG_EMBEDDING_API_KEY: e2e-fake-key
      BIGRAG_ALLOW_PRIVATE_EMBEDDING_BASE_URLS: "true"
      BIGRAG_CHAT_PROVIDER: openai_compatible
      BIGRAG_CHAT_MODEL: gpt-4o-mini
      BIGRAG_CHAT_BASE_URL: http://fake-openai:9001/v1
      BIGRAG_CHAT_API_KEY: e2e-fake-key
      BIGRAG_ALLOW_PRIVATE_CHAT_BASE_URLS: "true"
      BIGRAG_ALLOW_LOCAL_WEBHOOKS: "true"
    depends_on:
      bigrag-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      fake-openai:
        condition: service_healthy

  fake-openai:
    build: ./e2e/stubs/fake_openai
    container_name: bigrag-e2e-fake-openai
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:9001/health\").status==200 else 1)'"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-gdrive:
    build: ./e2e/stubs/fake_gdrive
    container_name: bigrag-e2e-fake-gdrive
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:9002/health\").status==200 else 1)'"]
      interval: 5s
      timeout: 3s
      retries: 10

  webhook-sink:
    build: ./e2e/stubs/webhook_sink
    container_name: bigrag-e2e-webhook-sink
    restart: unless-stopped
    ports:
      - "127.0.0.1:9003:9003"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:9003/health\").status==200 else 1)'"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bigrag-e2e-minio
    restart: unless-stopped
    command: server /data --console-address ":9005"
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9005"
    environment:
      MINIO_ROOT_USER: e2e
      MINIO_ROOT_PASSWORD: e2e-secret-password
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio_data:
