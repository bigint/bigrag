name: Bug report
description: Report a reproducible bug in rag.computer
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much of the template as possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue. Include curl commands, SDK snippets, or a small script if helpful.
      placeholder: |
        1. Start `./dev.sh`
        2. Create a collection with `curl ...`
        3. Upload `paper.pdf`
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rag.computer version
      placeholder: "0.1.x or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install rag.computer?
      options:
        - Docker / docker compose
        - From source
        - pip / uv
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, embedding provider, etc.
      placeholder: |
        - OS: macOS 14.5
        - Python: 3.12.4
        - Embedding provider: openai (text-embedding-3-small)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs. Set `RAG_COMPUTER_LOG_LEVEL=debug` for detailed output.
      render: shell
