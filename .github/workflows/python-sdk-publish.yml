name: Python SDK

on:
  push:
    tags:
      - "python-sdk-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock

      - name: Validate CalVer version
        id: version
        run: |
          version=$(uv run --with tomli python - <<'PY'
          import pathlib
          import re
          import sys

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          metadata = tomllib.loads(pathlib.Path("sdks/python/pyproject.toml").read_text())
          version = metadata["project"]["version"]
          if not re.fullmatch(r"[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?", version):
              print(f"Invalid CalVer version: {version}", file=sys.stderr)
              raise SystemExit(1)
          print(version)
          PY
          )
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "python-sdk-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match sdks/python version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: uv sync --dev
        working-directory: sdks/python

      - name: Test
        run: uv run pytest
        working-directory: sdks/python

      - name: Build
        run: uv build
        working-directory: sdks/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
