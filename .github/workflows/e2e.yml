name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build @bigrag/client SDK (vitest imports its dist/)
        run: pnpm --filter @bigrag/client build

      - name: Install Python deps
        run: uv sync
        working-directory: e2e

      - name: Run e2e (fake openai)
        working-directory: e2e
        env:
          BIGRAG_MASTER_KEY: "Zm5VZ4vO8r0y3rVsT0xz7nxV_wP7u6-n5tB1GAlHZIw="
        run: make e2e
