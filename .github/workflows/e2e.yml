name: e2e

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Build @bigrag/client SDK (vitest imports its dist/)
        run: pnpm --filter @bigrag/client build

      - name: Install Python deps
        run: uv sync
        working-directory: e2e

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium
        working-directory: e2e

      - name: Run e2e (fake openai)
        working-directory: e2e
        env:
          BIGRAG_MASTER_KEY: "Zm5VZ4vO8r0y3rVsT0xz7nxV_wP7u6-n5tB1GAlHZIw="
        run: make e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results
          if-no-files-found: ignore

  e2e-real-openai:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Build @bigrag/client SDK (vitest imports its dist/)
        run: pnpm --filter @bigrag/client build

      - name: Install Python deps
        run: uv sync
        working-directory: e2e

      - name: Bring up stack
        working-directory: e2e
        env:
          BIGRAG_MASTER_KEY: "Zm5VZ4vO8r0y3rVsT0xz7nxV_wP7u6-n5tB1GAlHZIw="
        run: make up

      - name: Run real-openai smoke
        working-directory: e2e
        env:
          BIGRAG_MASTER_KEY: "Zm5VZ4vO8r0y3rVsT0xz7nxV_wP7u6-n5tB1GAlHZIw="
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIGRAG_E2E_REAL_OPENAI: '1'
        run: make test-real

      - name: Tear down
        if: always()
        working-directory: e2e
        run: make down
