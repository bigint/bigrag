name: Docker

concurrency:
  group: docker-deploy
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read CalVer version
        id: version
        run: |
          version=$(grep '^version = ' api/pyproject.toml | head -n 1 | sed -E 's/version = "([^"]+)"/\1/')
          if [[ ! "$version" =~ ^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?$ ]]; then
            echo "Invalid CalVer version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yoginth/bigrag:${{ steps.version.outputs.version }}
            yoginth/bigrag:latest
            yoginth/bigrag:${{ github.sha }}
          cache-from: type=gha,scope=bigrag-api
          cache-to: type=gha,mode=max,scope=bigrag-api

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yoginth/bigrag-ui:${{ steps.version.outputs.version }}
            yoginth/bigrag-ui:latest
            yoginth/bigrag-ui:${{ github.sha }}
          cache-from: type=gha,scope=bigrag-ui
          cache-to: type=gha,mode=max,scope=bigrag-ui
