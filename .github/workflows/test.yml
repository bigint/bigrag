name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --dev
        working-directory: api

      - name: Ruff check
        run: uv run ruff check .
        working-directory: api

      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: api

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: biomejs/setup-biome@v2
      - name: Biome check
        run: biome check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --dev
        working-directory: api

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        working-directory: api

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: sdks/typescript

      - name: Type check
        run: pnpm tsc --noEmit
        working-directory: sdks/typescript

      - name: Run tests
        run: pnpm test
        working-directory: sdks/typescript

  website-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Type check
        run: pnpm typecheck
        working-directory: website

      - name: Build
        run: pnpm build
        working-directory: website

  studio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Type check
        run: pnpm typecheck
        working-directory: app

  e2e:
    # Runs only when repo-level variable RUN_E2E == 'true' (set it to
    # opt in once the OPENAI_API_KEY secret is populated). Keeps fork
    # PRs from trying to run against a key they can't see.
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bigrag
          POSTGRES_PASSWORD: bigrag
          POSTGRES_DB: bigrag
        options: >-
          --health-cmd "pg_isready -U bigrag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGRAG_DATABASE_URL: postgres://bigrag:bigrag@localhost:5432/bigrag?sslmode=disable
      BIGRAG_MILVUS_URI: http://localhost:19530
      BIGRAG_REDIS_URL: redis://localhost:6379/0
      BIGRAG_ENV: dev
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Start Milvus standalone
        run: |
          docker run -d --name milvus \
            -p 19530:19530 -p 9091:9091 \
            milvusdb/milvus:v2.5.0 \
            milvus run standalone
          for i in {1..60}; do
            if curl -sf http://localhost:9091/healthz > /dev/null; then
              echo "Milvus ready"; break
            fi
            sleep 2
          done

      - name: Install API deps
        run: uv sync --dev
        working-directory: api

      - name: Start API
        run: |
          uv run uvicorn bigrag.main:create_app --factory \
            --host 0.0.0.0 --port 6100 &
          for i in {1..60}; do
            if curl -sf http://localhost:6100/health > /dev/null; then
              echo "API ready"; break
            fi
            sleep 2
          done
        working-directory: api

      - name: Prepare e2e env
        run: |
          printf 'BIGRAG_URL=http://localhost:6100\n' > .env
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> .env
        working-directory: e2e

      - name: Run e2e suite
        run: uv run --with httpx python run.py
        working-directory: e2e
