services:
  bigrag:
    image: bigrag/bigrag:latest
    container_name: bigrag
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - /nvme/bigrag:/nvme
    environment:
      BIGRAG_STORAGE_BACKEND: s3
      BIGRAG_STORAGE_BUCKET: ${BIGRAG_STORAGE_BUCKET}
      BIGRAG_STORAGE_REGION: ${BIGRAG_STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BIGRAG_API_KEYS: ${BIGRAG_API_KEYS}
      BIGRAG_CACHE_NVME_PATH: /nvme
      BIGRAG_CACHE_NVME_SIZE_GB: ${BIGRAG_CACHE_NVME_SIZE_GB:-100}
      BIGRAG_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
